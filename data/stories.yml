version: "3.1"

stories:

- story: Saludo y despedida simple
  steps:
  - intent: saludar
  - action: utter_saludar
  - intent: despedir
  - action: utter_despedir

- story: Preguntar plan de estudios (materias de énfasis)
  steps:
  - intent: preguntar_plan_estudios
  - action: action_provide_plan_estudios
  - action: utter_pregunta_generica

- story: Preguntar prerequisitos de una materia de énfasis
  steps:
  - intent: preguntar_prerequisitos
    entities:
    - materia: "Robotica Inteligente"
  - slot_was_set:
    - materia: "Robotica Inteligente"
  - action: action_provide_prerequisitos
  - action: utter_pregunta_generica

- story: Preguntar por todas las areas de enfasis
  steps:
  - intent: preguntar_areas_enfasis
  - action: action_list_areas_enfasis
  - action: utter_pregunta_generica

- story: Preguntar por materias en area especifica
  steps:
  - intent: preguntar_materias_en_area
    entities:
    - area_enfasis: "Ciberseguridad"
  - slot_was_set:
    - area_enfasis: "Ciberseguridad"
  - action: action_list_materias_in_area
  - action: utter_pregunta_generica

- story: Preguntar detalles generales de una materia de énfasis
  steps:
  - intent: preguntar_detalle_materia
    entities:
    - materia: "Aprendizaje Automatico"
  - slot_was_set:
    - materia: "Aprendizaje Automatico"
  - action: action_provide_materia_details
  - action: utter_pregunta_generica


- story: Desafío de bot
  steps:
  - intent: bot_challenge
  - action: utter_iamabot


- story: Usuario agradece y se despide (simplificada)
  steps:
  - intent: saludar
  - action: utter_saludar
  - intent: preguntar_areas_enfasis
  - action: action_list_areas_enfasis
  - intent: agradecer 
  - intent: despedir
  - action: utter_despedir

- story: Preguntar nombre de la carrera (confirmación)
  steps:
  - intent: saludar
  - action: utter_saludar
  - intent: preguntar_nombre_carrera
  - action: action_informar_nombre_carrera
  - action: utter_pregunta_generica

- story: Preguntar duración de la carrera
  steps:
  - intent: preguntar_duracion_carrera
  - action: action_informar_duracion_carrera
  - action: utter_pregunta_generica

- story: Preguntar resultados profesionales
  steps:
  - intent: preguntar_resultados_profesionales
  - action: action_informar_resultados_profesionales
  - action: utter_pregunta_generica


- story: Listar áreas de énfasis y luego preguntar descripción de una
  steps:
  - intent: preguntar_areas_enfasis
  - action: action_list_areas_enfasis
  - intent: preguntar_descripcion_area_enfasis
    entities:
    - area_enfasis: "Inteligencia Artificial y Robótica"
  - slot_was_set:
    - area_enfasis: "Inteligencia Artificial y Robótica"
  - action: action_informar_descripcion_area_enfasis
  - action: utter_pregunta_generica

- story: Preguntar descripción de un área de énfasis directamente (nombre corto)
  steps:
  - intent: preguntar_descripcion_area_enfasis
    entities:
    - area_enfasis: "videojuegos"
  - slot_was_set:
    - area_enfasis: "videojuegos"
  - action: action_informar_descripcion_area_enfasis
  - action: utter_pregunta_generica

- story: Preguntar descripción y luego materias de la misma área (aprovechando slot)
  steps:
  - intent: preguntar_descripcion_area_enfasis
    entities:
    - area_enfasis: "Desarrollo Web y Multiplataforma"
  - slot_was_set:
    - area_enfasis: "Desarrollo Web y Multiplataforma"
  - action: action_informar_descripcion_area_enfasis
  - intent: preguntar_materias_en_area
  - action: action_list_materias_in_area
  - action: utter_pregunta_generica

- story: Preguntar por un área de énfasis que no existe
  steps:
  - intent: preguntar_descripcion_area_enfasis
    entities:
    - area_enfasis: "Marketing Digital Avanzado" # Área inventada
  - slot_was_set:
    - area_enfasis: "Marketing Digital Avanzado"
  - action: action_informar_descripcion_area_enfasis # La acción debe responder con utter_area_no_encontrada
  - action: utter_pregunta_generica

