    entities:
    - materia: "Diseño de Videojuegos"
  - slot_was_set:
    - materia: "Diseño de Videojuegos"
  - action: action_informar_clave_materia
  - action: utter_pregunta_generica

- story: Preguntar nombre de una materia de énfasis dada su clave
  steps:
  - intent: preguntar_nombre_materia_por_clave
    entities:
    - materia: "2834" # Motores Graficos
  - slot_was_set:
    - materia: "2834"
  - action: action_informar_nombre_materia_por_clave
  - action: utter_pregunta_generica

- story: Preguntar por una materia de énfasis que no existe (usando intent específico)
  steps:
  - intent: preguntar_objetivo_materia
    entities:
    - materia: "Física de Partículas para IA"
  - slot_was_set:
    - materia: "Física de Partículas para IA"
  - action: action_informar_objetivo_materia 
  - action: utter_pregunta_generica

# --- Historias Combinadas y de Flujo (Más largas) ---
- story: Conversación más larga sobre materias de énfasis (simplificada por regla de agradecer)
  steps:
  - intent: saludar
  - action: utter_saludar
  - intent: preguntar_materias_en_area
    entities:
    - area_enfasis: "Inteligencia Artificial y Robótica"
  - slot_was_set:
    - area_enfasis: "Inteligencia Artificial y Robótica"
  - action: action_list_materias_in_area
  - intent: preguntar_objetivo_materia
    entities:
    - materia: "Programación de Robots"
  - slot_was_set:
    - materia: "Programación de Robots"
  - action: action_informar_objetivo_materia
  - intent: preguntar_creditos_materia
  - action: action_informar_creditos_materia
  - intent: preguntar_prerequisitos
  - action: action_provide_prerequisitos
  - intent: agradecer 
  - intent: despedir 
  - action: utter_despedir

- story: Usuario pregunta sobre materia sin especificarla, luego la especifica
  steps:
  - intent: saludar
  - action: utter_saludar
  - intent: preguntar_objetivo_materia # No hay entidad materia aquí
  - action: utter_pedir_materia_especifica # Bot pide la materia
  - intent: preguntar_detalle_materia # Usuario responde con la materia.
    entities:
    - materia: "Ciencia de Datos"
  - slot_was_set:
    - materia: "Ciencia de Datos"
  - action: action_informar_objetivo_materia # Ahora la acción tiene la materia y puede responder al intent original
  - action: utter_pregunta_generica

- story: Cambio de tema pregunta por área, luego por materia de otra área
  steps:
  - intent: preguntar_descripcion_area_enfasis
    entities:
    - area_enfasis: "Ciberseguridad"
  - slot_was_set:
    - area_enfasis: "Ciberseguridad"
  - action: action_informar_descripcion_area_enfasis
  - intent: preguntar_objetivo_materia # Cambia a preguntar por una materia
    entities:
    - materia: "Programacion de Videojuegos" # Materia de un área diferente
  - slot_was_set:
    - materia: "Programacion de Videojuegos"
  - action: action_informar_objetivo_materia
  - action: utter_pregunta_generica

- story: Usuario afirma después de una respuesta y luego se despide
  steps:
  - intent: preguntar_creditos_materia
    entities:
    - materia: "Aplicaciones Web Interactivas"
  - slot_was_set:
    - materia: "Aplicaciones Web Interactivas"
  - action: action_informar_creditos_materia
  - intent: afirmar # Usuario dice "ok" o "sí, gracias"
  - action: utter_pregunta_generica # La acción de afirmar no tiene respuesta directa, así que podemos ofrecer ayuda
  - intent: despedir
  - action: utter_despedir

- story: Usuario niega (posible malentendido) y reformula
  steps:
  - intent: preguntar_detalle_materia
    entities:
    - materia: "Robotica Inteligente"
  - slot_was_set:
    - materia: "Robotica Inteligente"
  - action: action_provide_materia_details # Bot da info general
  - intent: negar # Usuario dice "no, eso no era" o "no me refiero a eso"
  - action: utter_no_entiendo # O una respuesta más específica
  - intent: preguntar_contenido_materia # Usuario reformula, pidiendo algo más específico
    entities:
    - materia: "Robotica Inteligente"
  - slot_was_set: # Slot materia ya está seteado
    - materia: "Robotica Inteligente"
  - action: action_informar_contenido_materia
  - action: utter_pregunta_generica