    - Dime sobre las areas de enfasis
    - Que opciones de especializacion hay?

- intent: preguntar_materias_en_area
  examples: |
    - Que materias hay en el area de [Inteligencia Artificial y Robótica](area_enfasis)?
    - Listame las materias del area de [Interacción y Videojuegos](area_enfasis)
    - Cuales son los cursos del area de [Desarrollo Web y Multiplataforma](area_enfasis)?
    - Que materias hay en [Inteligencia Artificial y Robótica](area_enfasis)?
    - Cursos en el area de [Interacción y Videojuegos](area_enfasis)
    - Materias del area de [Ciberseguridad](area_enfasis)
    - Que materias da el area de [Desarrollo Web y Multiplataforma](area_enfasis)?
    - Listame los cursos del area de [IA y Robótica](area_enfasis) # Usando acrónimo o nombre corto
    - Materias en [videojuegos](area_enfasis) # Usando parte del nombre
    - Cuales son los cursos de [ciberseguridad](area_enfasis) # Con minúsculas y sin "area de"
    - que materias estan en [inteligencia artificial](area_enfasis) # Con minúsculas y nombre parcial
    - materis en [Inteligencia Artificial y Robótica](area_enfasis) # Con error tipográfico en otra palabra
    - Que materias hay en [Inteligencia Artificial y Robota](area_enfasis)? 

