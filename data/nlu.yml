    - Requisitos para [Arte Conceptual Para Videojuegos](materia)
    - [Temas Selectos de Videojeugos](materia) prerequisitos
    - Que va antes de [Computo Bio-Inspirado](materia)? 
    - Me puedes decir que necesito para [Vison Computacional](materia)? 

- intent: preguntar_areas_enfasis
  examples: |
    - Cuales son las areas de enfasis?
    - Que especializaciones hay en la carrera?
