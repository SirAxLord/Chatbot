version: "3.1"

nlu:
- intent: saludar
  examples: |
    - Hola
    - Buenas
    - Qué tal

- intent: goodbye
  examples: |
    - Adiós
    - Nos vemos
    - Hasta luego
    - salir
    - bye
    - chao
    - adios bot
    - nos vemos luego

- intent: bot_challenge
  examples: |
    - Eres un bot?
    - ¿Eres humano?

- intent: preguntar_plan_estudios
  examples: |
    - ¿Cuál es el plan de estudios?
    - ¿Qué materias tengo que cursar?

- intent: preguntar_prerequisitos
  examples: |
