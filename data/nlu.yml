    - ¿Qué materias debo aprobar antes de [Representacion del Conocimiento y Ontologias](materia)?
    - Cuales son los requisitos para [Fundamentos de Desarrollo Web](materia)?
    - Que necesito para ver [Diseño de Videojuegos](materia)?
