version: "3.1"

rules:

- rule: Decir adiós cuando el usuario se despide 
  steps:
  - intent: despedir
  - action: utter_despedir

- rule: Identificarse como bot cuando se le pregunta
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Responder a agradecimiento
  steps:
  - intent: agradecer
  - action: utter_agradecer