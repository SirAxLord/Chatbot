version: "3.1"

intents:
  - saludar
  - preguntar_plan_estudios
  - preguntar_prerequisitos
  - preguntar_areas_enfasis
  - preguntar_materias_en_area
  - goodbye
  - bot_challenge
  - preguntar_detalle_materia

actions:
  - action_provide_plan_estudios
  - action_provide_prerequisitos
  - action_list_areas_enfasis
  - action_list_materias_in_area
  - action_provide_materia_details

entities:
  - materia
  - area_enfasis

slots:
  materia:
    type: text
    mappings:
      - type: from_entity
        entity: materia
  area_enfasis:
     type: text
     mappings:
      - type: from_entity
        entity: area_enfasis

responses:
  utter_saludar:
    - text: "Hola! Soy el asistente académico. ¿En qué puedo ayudarte?"

  utter_goodbye:
    - text: "Adiós, ¡hasta pronto!"
  
  utter_iamabot:
    - text: "¡Soy un chatbot creado para ayudarte!"
